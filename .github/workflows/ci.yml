name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ycd_oil_erp?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ycd_oil_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ycd_oil_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npm run db:seed
      - run: npm run verify:preopening
      - run: npm run verify:controls
      - run: npm run verify:brand
      - run: npm run typecheck
      - run: npm run build
      - name: Production health smoke test
        env:
          AUTH_SECRET: ci-only-health-secret-not-for-production-0123456789abcdef
        run: |
          npm start > /tmp/ycd-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/ycd-health.json; then
              cat /tmp/ycd-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ycd-next.log
          exit 1
