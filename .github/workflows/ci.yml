name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ycd_oil_erp?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ycd_oil_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ycd_oil_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npx prisma db push --skip-generate
      - run: npm run db:seed
      - run: npm run verify:preopening
      - run: npm run verify:controls
      - run: npm run verify:brand
      - run: npm run typecheck
      - run: npm run build
